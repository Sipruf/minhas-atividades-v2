# Publica o app no GitHub Pages a cada push na branch main (ou manualmente pela aba Actions).
# Roda os testes antes: se algum falhar, nada é publicado.
# Pré-requisito no repositório: Settings → Pages → Source: "GitHub Actions".

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; um novo push cancela o que ainda não terminou.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Gerar o build
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
